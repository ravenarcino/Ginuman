
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">

<title>GINUMAN FEST 2027</title>

<style>

/* GENERAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

body {
    position: fixed;
    inset: 0;
}

/* START SCREEN */
#startScreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background-color: #000;
    background-image: url("gamebg.png");
    background-position: center center;
    background-size: contain;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 10;
    cursor: pointer;
}

#startScreen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.20);
}

/* START TEXT */
.start-content {
    position: relative;
    text-align: center;
    animation: floating 2s ease-in-out infinite;
}

.tap-text {
    font-size: clamp(30px, 9vw, 55px);
    font-weight: 900;
    letter-spacing: 5px;
    color: white;

    text-shadow:
        0 0 10px #ffcc00,
        0 0 20px #ff9900,
        0 0 40px #ff6600;

    animation: glowing 1.5s ease-in-out infinite alternate;
}

.tap-subtitle {
    margin-top: 15px;
    font-size: 12px;
    letter-spacing: 4px;
    color: white;
}

/* ANIMATIONS */
@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

@keyframes glowing {
    from {
        opacity: .65;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1.05);
    }
}

/* VIDEO SCREENS */
#videoScreen,
#endScreen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: #000;

    display: none;
    justify-content: center;
    align-items: center;
}

/* MAIN VIDEO */
#videoScreen {
    z-index: 2;
}

/* FINAL VIDEO */
#endScreen {
    z-index: 20;
}

/* VIDEO FIT - NO CROPPING */
#festVideo,
#betterLuckVideo {
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #000;
    display: block;
}

</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen">

    <div class="start-content">

        <div class="tap-text">
            TAP TO PLAY
        </div>

        <div class="tap-subtitle">
            GINUMAN FEST 2027
        </div>

    </div>

</div>

<!-- MAIN GAME VIDEO -->
<div id="videoScreen">

    <video
        id="festVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
    >
        <source src="ginuman.mp4" type="video/mp4">
        Your browser does not support HTML video.
    </video>

</div>

<!-- FINAL VIDEO -->
<div id="endScreen">

    <video
        id="betterLuckVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
    >
        <source src="betterluck.mp4" type="video/mp4">
        Your browser does not support HTML video.
    </video>

</div>

<script>

/* ELEMENTS */
const startScreen = document.getElementById("startScreen");
const videoScreen = document.getElementById("videoScreen");
const endScreen = document.getElementById("endScreen");

const video = document.getElementById("festVideo");
const finalVideo = document.getElementById("betterLuckVideo");

/* STATES */
let gameStarted = false;
let changingVideo = false;
let finalScreenActive = false;


/* =================================
   START GAME
================================= */

async function startGame() {

    if (gameStarted) return;

    gameStarted = true;
    changingVideo = true;

    startScreen.style.display = "none";
    videoScreen.style.display = "flex";

    video.src = "ginuman.mp4";
    video.load();

    try {

        await video.play();

        changingVideo = false;

    } catch (error) {

        console.log("Game video playback error:", error);

        changingVideo = false;

    }

}


/* =================================
   MAIN GAME VIDEO ENDED
================================= */

video.addEventListener("ended", function() {

    if (changingVideo || finalScreenActive) return;

    showFinalScreen();

});


/* =================================
   FINAL VIDEO
================================= */

async function showFinalScreen() {

    if (finalScreenActive) return;

    finalScreenActive = true;
    changingVideo = true;

    // Stop main game video
    video.pause();
    video.removeAttribute("src");
    video.load();

    // Show final video screen
    videoScreen.style.display = "none";
    endScreen.style.display = "flex";

    // Play betterluck.mp4
    try {

        await finalVideo.play();

        changingVideo = false;

    } catch (error) {

        console.log("Final video playback error:", error);

        changingVideo = false;

    }

}


/* =================================
   TAP TO START
================================= */

startScreen.addEventListener("click", startGame);


/* =================================
   TAP ANYWHERE TO PAUSE / PLAY
================================= */

videoScreen.addEventListener("click", toggleVideo);

videoScreen.addEventListener("touchend", function(event) {

    event.preventDefault();

    toggleVideo();

}, { passive: false });


function toggleVideo() {

    if (
        !gameStarted ||
        changingVideo ||
        finalScreenActive
    ) {
        return;
    }

    if (video.paused) {

        video.play().catch(() => {});

    } else {

        video.pause();

    }

}


/* =================================
   HIDE CONTEXT MENU
================================= */

document.addEventListener("contextmenu", function(event) {

    event.preventDefault();

});

</script>

</body>
</html>
